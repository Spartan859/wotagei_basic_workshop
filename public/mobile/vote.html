<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>投票</title>
  <link rel="stylesheet" href="css/mobile.css">
</head>
<body>
  <div class="container">
    <h1 id="battle-title">投票</h1>

    <div id="dancers-container"></div>
    <div id="vote-result" class="vote-result" aria-live="polite" hidden></div>
  </div>

  <script src="js/mobile.js"></script>
  <script>
    // 包在 IIFE 里：普通 <script> 顶层不允许 return（否则整段脚本语法错误、页面空白）
    (() => {
      const user = checkNickname();
      if (!user) return;

      // 获取 battleId
      const params = new URLSearchParams(window.location.search);
      const battleId = params.get('battle') || 'battle1';

      document.getElementById('battle-title').textContent =
        battleId === 'battle1' ? 'BATTLE 1 投票' : 'BATTLE 2 投票';

      // 加载舞者信息与当前截票状态
      async function loadVoteData() {
        const data = await fetchWithErrorHandling(`${API_BASE_URL}/vote/${battleId}`);
        if (!data) return;

        const container = document.getElementById('dancers-container');
        container.innerHTML = `
          <button class="dancer-btn" data-dancer="dancer1" ${data.locked ? 'disabled' : ''}>
            <img src="${escapeHtml(data.dancer1.avatar)}" alt="${escapeHtml(data.dancer1.name)}">
            <span>${escapeHtml(data.dancer1.name)}</span>
          </button>
          <button class="dancer-btn" data-dancer="dancer2" ${data.locked ? 'disabled' : ''}>
            <img src="${escapeHtml(data.dancer2.avatar)}" alt="${escapeHtml(data.dancer2.name)}">
            <span>${escapeHtml(data.dancer2.name)}</span>
          </button>
        `;

        document.querySelectorAll('.dancer-btn').forEach(btn => {
          btn.addEventListener('click', () => vote(btn.dataset.dancer));
        });

        const result = document.getElementById('vote-result');
        if (!data.locked || !data.result) {
          result.hidden = true;
          result.textContent = '';
          return;
        }

        result.hidden = false;
        if (data.result.type === 'tie') {
          result.textContent = `投票已结束：${data.dancer1.name} ${data.dancer1.votes} 票，` +
            `${data.dancer2.name} ${data.dancer2.votes} 票，平票。`;
        } else {
          const winner = data[data.result.winner];
          result.textContent = `投票已结束：${winner.name} 以 ${winner.votes} 票获胜。`;
        }
      }

      loadVoteData();

      async function vote(dancer) {
        const buttons = document.querySelectorAll('.dancer-btn');
        buttons.forEach(btn => btn.disabled = true);

        const result = await fetchWithErrorHandling(`${API_BASE_URL}/vote`, {
          method: 'POST',
          body: JSON.stringify({
            battleId,
            dancer,
            deviceId: user.deviceId
          })
        });

        if (result && result.success) {
          showMessage('投票成功！', 'success');
        } else {
          // 刷新真实状态，区分已截票、重复投票和网络错误。
          window.setTimeout(loadVoteData, result === null ? 600 : 0);
        }
      }
    })();
  </script>
</body>
</html>
