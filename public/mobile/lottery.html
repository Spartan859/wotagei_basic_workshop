<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>抽奖</title>
  <link rel="stylesheet" href="css/mobile.css">
</head>
<body>
  <div class="container">
    <h1>抽奖环节</h1>
    <h2><span id="user-nickname"></span>，参与抽奖</h2>

    <button id="join-btn">参与抽奖</button>

    <div id="result-container" style="display: none;">
      <div class="message success">
        <p>✅ 已参与，请关注大屏幕</p>
      </div>

      <p style="text-align: center; margin-top: 15px;">
        当前参与人数：<strong id="participant-count"></strong>
      </p>
    </div>
  </div>

  <script src="js/mobile.js"></script>
  <script>
    // 包在 IIFE 里：普通 <script> 顶层不允许 return（否则整段脚本语法错误、页面空白）
    (() => {
      const user = checkNickname();
      if (!user) return;

      document.getElementById('user-nickname').textContent = user.nickname;

      const joinBtn = document.getElementById('join-btn');
      const resultContainer = document.getElementById('result-container');

      joinBtn.addEventListener('click', async () => {
        joinBtn.disabled = true;
        joinBtn.textContent = '参与中...';

        const result = await fetchWithErrorHandling(`${API_BASE_URL}/lottery/join`, {
          method: 'POST',
          body: JSON.stringify({
            nickname: user.nickname,
            deviceId: user.deviceId
          })
        });

        if (result && result.success) {
          document.getElementById('participant-count').textContent = result.participantCount;
          resultContainer.style.display = 'block';
          joinBtn.style.display = 'none';

          if (result.alreadyJoined) {
            showMessage('您已经参与过了', 'info');
          }
        } else {
          joinBtn.disabled = false;
          joinBtn.textContent = '参与抽奖';
        }
      });
    })();
  </script>
</body>
</html>
