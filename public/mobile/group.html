<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>上手实操分组</title>
  <link rel="stylesheet" href="css/mobile.css">
</head>
<body>
  <div class="container">
    <h1>上手实操分组</h1>
    <h2>欢迎，<span id="user-nickname"></span>！</h2>

    <button id="join-btn">加入分组</button>

    <div id="result-container" style="display: none;">
      <div class="message success">
        <p>您已加入第 <strong id="group-id"></strong> 组</p>
      </div>

      <h3>当前组员：</h3>
      <ul id="member-list" class="member-list"></ul>
    </div>
  </div>

  <script src="js/mobile.js"></script>
  <script>
    const user = checkNickname();
    if (!user) return;

    document.getElementById('user-nickname').textContent = user.nickname;

    const joinBtn = document.getElementById('join-btn');
    const resultContainer = document.getElementById('result-container');

    joinBtn.addEventListener('click', async () => {
      joinBtn.disabled = true;
      joinBtn.textContent = '加入中...';

      const result = await fetchWithErrorHandling(`${API_BASE_URL}/group/join`, {
        method: 'POST',
        body: JSON.stringify({
          nickname: user.nickname,
          deviceId: user.deviceId
        })
      });

      if (result && result.success) {
        document.getElementById('group-id').textContent = result.groupId;

        const memberList = document.getElementById('member-list');
        memberList.innerHTML = result.groupMembers.map(name =>
          `<li>${name}${name === user.nickname ? ' (你)' : ''}</li>`
        ).join('');

        resultContainer.style.display = 'block';
        joinBtn.style.display = 'none';

        if (result.alreadyJoined) {
          showMessage('您已经在这个组了', 'info');
        }
      } else {
        joinBtn.disabled = false;
        joinBtn.textContent = '加入分组';
      }
    });
  </script>
</body>
</html>
