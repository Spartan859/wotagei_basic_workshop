name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 16

      - name: Install dependencies
        run: |
          cd server
          npm ci

      - name: Start server for testing
        run: |
          cd server
          PORT=3000 node app.js &
          SERVER_PID=$!
          sleep 3
          echo "SERVER_PID=$SERVER_PID" >> $GITHUB_ENV

      - name: Health check
        run: |
          curl -fsS http://localhost:3000/ | grep -q '管理员令牌'
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://localhost:3000/presentation/index.html)" = "302"
          curl -f http://localhost:3000/api/vote/battle1

      - name: Stop server
        if: always()
        run: |
          kill $SERVER_PID || true

  docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    needs: test
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: image
        run: |
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "name=ghcr.io/${OWNER_LC}/wotagei-workshop" >> "$GITHUB_OUTPUT"

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha
            type=raw,value=${{ github.sha }}
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.ref == 'refs/heads/main' }}
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test Docker image
        run: |
          image="${{ steps.image.outputs.name }}:${{ github.sha }}"
          container="wotagei-ci-smoke"
          cleanup() {
            docker rm -f "$container" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker run --detach --name "$container" \
            --env ADMIN_TOKEN=ci-smoke-token \
            --publish 3001:3000 \
            "$image"

          ready=0
          for _ in $(seq 1 20); do
            if curl --fail --silent http://localhost:3001/ | grep -q '管理员令牌'; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" = "1"
          test "$(curl -sS -o /dev/null -w '%{http_code}' \
            http://localhost:3001/presentation/index.html)" = "302"
          curl --fail --silent http://localhost:3001/api/vote/battle1 >/dev/null

          docker logs "$container"
