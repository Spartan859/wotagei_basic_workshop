name: Deploy

on:
  workflow_dispatch:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: production-wotagei-satintin
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy wotagei.satintin.com
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://wotagei.satintin.com
    steps:
      - name: Resolve revision
        id: revision
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_SHA: ${{ github.event.workflow_run.head_sha }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_run" ]]; then
            echo "sha=$WORKFLOW_SHA" >> "$GITHUB_OUTPUT"
          else
            echo "sha=$CURRENT_SHA" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.revision.outputs.sha }}

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Update deploy script on server
        run: |
          ssh -T -i ~/.ssh/deploy_key wotagei-deploy@120.77.57.144 \
            "sudo -n /usr/local/sbin/wotagei-compose-deploy --install-self" \
            < deploy/wotagei-compose-deploy.sh

      - name: Deploy Docker Compose
        env:
          RELEASE_ID: ${{ steps.revision.outputs.sha }}
        run: |
          ssh -tt -i ~/.ssh/deploy_key wotagei-deploy@120.77.57.144 \
            "sudo -n /usr/local/sbin/wotagei-compose-deploy '$RELEASE_ID'"

      # 经 nginx 反代验证（wotagei.satintin.com 的 DNS 记录尚未配置，
      # 直连域名会失败，因此用 Host 头走本机 80 端口验证整条链路）
      - name: Verify service through nginx
        run: |
          ssh -T -i ~/.ssh/deploy_key wotagei-deploy@120.77.57.144 \
            "curl -fsS --max-time 10 -H 'Host: wotagei.satintin.com' \
               http://127.0.0.1/presentation/index.html | head -5"
          ssh -T -i ~/.ssh/deploy_key wotagei-deploy@120.77.57.144 \
            "curl -fsS --max-time 10 -H 'Host: wotagei.satintin.com' \
               http://127.0.0.1/api/vote/battle1"
